name: Release

# A release is a PR from develop into production, merged as a merge commit.
# Cloudflare Workers Builds deploys production on its own; this workflow tags
# the release, checks the live bot, and syncs develop back up to production.
on:
  pull_request:
    branches: [production]
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: production

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag -l "v*" --sort=-v:refname | head -n1)
          echo "tag=${TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: next_version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CURRENT: ${{ steps.latest_tag.outputs.tag }}
        run: |
          VERSION="${CURRENT#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if echo "$LABELS" | grep -q "release:major"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$LABELS" | grep -q "release:minor"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Generate changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PREV_TAG: ${{ steps.latest_tag.outputs.tag }}
          NEXT_VERSION: ${{ steps.next_version.outputs.version }}
        run: |
          {
            echo "## $PR_TITLE (#$PR_NUMBER)"
            echo ""
            echo "$PR_BODY" | head -100
            echo ""
            echo "---"
            echo "**Full diff:** [$PREV_TAG...$NEXT_VERSION]($PR_URL)"
          } > release-notes.md

      # The bot posts this release in #releases, like the other repos' releases.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.next_version.outputs.version }}" \
            --target production \
            --title "${{ steps.next_version.outputs.version }}" \
            --notes-file release-notes.md

  smoke-test:
    needs: release
    runs-on: ubuntu-latest
    env:
      # Discord and GitHub call the workers.dev address, and only there does
      # "/" answer with the bot's info instead of redirecting to the leaderboard.
      BASE_URL: https://codercops-discord-bot.copscoder.workers.dev
      PUBLIC_URL: https://oss.codercops.com
      EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Wait for the Cloudflare deploy of this merge
        run: |
          # Workers Builds deploys production on its own. "/" names the commit
          # it built, so poll until it matches (up to 15 minutes).
          for i in $(seq 1 90); do
            LIVE=$(curl -s --max-time 10 "$BASE_URL/" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$LIVE" = "$EXPECTED_SHA" ]; then
              echo "Live on $LIVE"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$BASE_URL runs ${LIVE:-nothing}, expected $EXPECTED_SHA"
          exit 1

      - name: Endpoints refuse unsigned requests
        run: |
          for path in interactions github; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -X POST -d '{}' "$BASE_URL/$path")
            if [ "$STATUS" != "401" ]; then
              echo "::error::POST /$path without a signature returned $STATUS, expected 401"
              exit 1
            fi
          done
          echo "Signature checks passed"

      - name: Leaderboard reachable
        run: |
          # Bot Fight Mode on codercops.com answers GitHub's runners with a
          # Cloudflare challenge (403 with cf-mitigated: challenge) instead of
          # the page. The checks above already ran against the deployed commit,
          # so a challenge here still means the host is up.
          read -r STATUS MITIGATED < <(curl -sL -o /dev/null -w "%{http_code} %header{cf-mitigated}\n" --max-time 30 "$PUBLIC_URL/leaderboard")
          if [ "$STATUS" = "200" ]; then
            echo "Leaderboard check passed"
          elif [ "$STATUS" = "403" ] && [ "$MITIGATED" = "challenge" ]; then
            echo "::notice::Cloudflare challenged this runner on $PUBLIC_URL, so the page itself wasn't checked"
          else
            echo "::error::/leaderboard returned status $STATUS"
            exit 1
          fi

  sync-develop:
    needs: [release, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: develop
          # develop requires PRs, so the default token cannot push to it. Use a
          # maintainer PAT in RELEASE_TOKEN (a bypass actor) for the fast-forward.
          # Without it this step warns and you sync develop manually.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync develop with production
        run: |
          git fetch origin production
          # A release PR is a merge commit, so develop should fast-forward.
          git merge --ff-only origin/production || {
            echo "::warning::develop did not fast-forward; leaving it unchanged."
            exit 0
          }
          if ! git push origin develop; then
            echo "::warning::Could not push develop (branch protection). Add a RELEASE_TOKEN secret with a bypass-capable PAT, or sync manually: git checkout develop && git merge --ff-only origin/production && git push origin develop"
          fi
